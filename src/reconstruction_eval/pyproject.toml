[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reconstruction_eval"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "utils",
    "torch",
    "torchmetrics",
    "pytorch-msssim",
    "opencv-python",
]

[tool.setuptools.packages.find]
where = [".."]
include = ["reconstruction_eval*"]
